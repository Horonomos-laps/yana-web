# Modeled on Yana-AI .github/dependabot.yml: weekly, 7-day cooldown, minor and
# patch updates grouped per directory.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      yana-web:
        patterns: ["*"]
        update-types: [minor, patch]
      yana-web-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      site:
        patterns: ["*"]
        update-types: [minor, patch]
      site-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /yana-desktop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      yana-desktop:
        patterns: ["*"]
        update-types: [minor, patch]
      yana-desktop-security:
        applies-to: security-updates
        patterns: ["*"]
