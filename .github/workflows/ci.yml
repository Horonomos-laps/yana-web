name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Node tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, same pin as Yana-AI
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, same pin as Yana-studio
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts
      - name: Run every _test_ file at the root
        run: |
          fail=0
          for f in _test_*.js _test_*.mjs; do
            echo "::group::$f"
            if ! timeout 120 node "$f"; then
              echo "FAILED: $f"
              fail=1
            fi
            echo "::endgroup::"
          done
          exit $fail

      # The web app's own modules keep their tests next to them (desktop-src/lib, desktop-src/new-app),
      # which the loop above never reached. Each test runs from its own folder.
      - name: Run every _test_ file under desktop-src
        run: |
          fail=0
          for f in $(find desktop-src -type f \( -name '_test_*.js' -o -name '_test_*.mjs' \) -not -path '*/node_modules/*' | sort); do
            echo "::group::$f"
            if ! (cd "$(dirname "$f")" && timeout 120 node "$(basename "$f")"); then
              echo "FAILED: $f"
              fail=1
            fi
            echo "::endgroup::"
          done
          exit $fail

      - name: Website tests (Python, standard library)
        run: python3 -m unittest discover -s tests -p "test_*.py" -v

  site:
    name: Astro site build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, same pin as Yana-AI
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, same pin as Yana-studio
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install
        working-directory: site
        run: npm ci --ignore-scripts
      - name: Build
        working-directory: site
        run: npm run build

  dependency-audit:
    name: npm audit (production dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, same pin as Yana-AI
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, same pin as Yana-studio
        with:
          node-version: 24
      - name: Audit yana-web
        run: npm audit --omit=dev --package-lock-only
      - name: Audit yana-desktop
        working-directory: yana-desktop
        run: npm audit --omit=dev --package-lock-only
