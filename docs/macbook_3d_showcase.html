<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yana Studio — trình diễn MacBook 3D</title>
<meta name="description" content="Con MacBook gập mở của trang chủ Yana: mở nắp máy rồi xem Yana Studio duyệt một lệnh.">
<link rel="icon" type="image/svg+xml" href="yana-mark.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  /* The same Mac as the home hero: our own 3D model (/embed/mac, an iframe whose lid angle is sent
     by message) that hands over to a photographed MacBook once the lid is fully open. The photo
     stays flat and uncut; only its screen moves. Here a button and a slider open the lid instead of
     page scrolling. */
  :root {
    --ink: #26306a; --muted: #6b7399; --line: rgba(38, 48, 106, .10); --violet: #8b5cf6;
    --sans: "Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: space-between; gap: 16px;
    padding: 24px; overflow-x: hidden; color: var(--ink); font-family: var(--sans);
    background:
      radial-gradient(50% 45% at 14% 16%, #c8d6ff 0, transparent 72%),
      radial-gradient(46% 50% at 88% 24%, #e6d4ff 0, transparent 72%),
      radial-gradient(60% 54% at 60% 100%, #cde8ff 0, transparent 72%),
      linear-gradient(160deg, #eef2ff, #e3e9ff 52%, #f2ebff);
  }
  a { color: inherit; text-decoration: none; }

  .bar { width: 100%; max-width: 1120px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
    padding: 14px 22px; border-radius: 20px; background: rgba(255, 255, 255, .7); backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, .9); box-shadow: 0 10px 30px -18px rgba(38, 48, 106, .4); }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand img { width: 38px; height: 38px; }
  .brand h1 { font-size: 1.05rem; font-weight: 800; letter-spacing: -.01em; }
  .brand p { font-size: .76rem; color: var(--muted); }
  .controls { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .btn { font: 700 .8rem var(--sans); padding: 9px 18px; border-radius: 10px; border: 1px solid var(--ink); background: var(--ink); color: #fff; cursor: pointer; min-width: 112px; }
  .btn:hover { filter: brightness(1.15); }
  .btn:focus-visible, .range:focus-visible { outline: 2px solid var(--violet); outline-offset: 3px; }
  .lidctl { display: flex; align-items: center; gap: 10px; font-size: .76rem; color: var(--muted); }
  .range { width: 170px; accent-color: var(--violet); cursor: pointer; }

  .stage { width: 100%; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 12px 0; }
  .pin { width: 100%; }
  .device { position: relative; z-index: 2; width: min(1180px, 94vw); aspect-ratio: 1.6; margin: 0 auto; touch-action: none; cursor: grab; }
  .device.is-dragging { cursor: grabbing; }
  /* A transparent layer over the 3D iframe so a swipe on the Mac reaches this page (an iframe swallows pointer events). */
  .swipe { position: absolute; inset: 0; }
  .swipe-hint { margin-top: 6px; text-align: center; font-size: .8rem; color: var(--muted); }
  .device iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: transparent; transition: opacity .45s ease; }
  .pin.is-photo .device iframe { opacity: 0; pointer-events: none; }

  /* photographed MacBook, placed to match the 3D lid at full open */
  .mac-photo { position: absolute; left: 16.75%; top: 9.6%; width: 66.5%; aspect-ratio: 1930 / 1270; opacity: 0; pointer-events: none; transition: opacity .45s ease; }
  .pin.is-photo .mac-photo { opacity: 1; }
  .mac-photo-screen { position: absolute; left: 10.829%; top: 11.339%; width: 78.342%; height: 77.323%; overflow: hidden; background: #000; }
  .pin.is-photo .mac-photo-screen { pointer-events: auto; }
  .mac-photo-screen video { display: block; width: 100%; height: 100%; object-fit: cover; }
  .mac-photo-bezel { position: absolute; inset: 0; width: 100%; height: 100%; }
  .mac-glare { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .4s ease;
    background: radial-gradient(420px circle at var(--glare-x, 50%) var(--glare-y, 30%), rgba(255, 255, 255, .16), transparent 60%); }
  .mac-photo-screen:hover .mac-glare { opacity: 1; }

  /* the approval card on the photographed screen: answer it like in Yana Studio */
  .mac-gate { position: absolute; right: 1.5%; top: 8%; width: 25%; padding: 1.1% 1.3% 1.2%; border-radius: 10px;
    background: rgba(22, 26, 34, .94); color: #e8ecf3; border: 1px solid rgba(245, 165, 36, .55); box-shadow: 0 14px 30px -10px rgba(0, 0, 0, .6);
    font: 600 clamp(8px, .56vw, 11px)/1.35 var(--sans); transform: translateX(120%); opacity: 0;
    transition: transform .7s cubic-bezier(.2, 1, .3, 1) .15s, opacity .4s ease .15s, border-color .3s ease; }
  .pin.is-photo .mac-gate { transform: none; opacity: 1; }
  .pin:not(.is-photo) .mac-gate { visibility: hidden; }
  .mac-gate p { margin: 0; }
  .mac-gate-head b { color: #f5a524; }
  .mac-gate code { font: 600 .95em var(--mono); color: #fbd38d; }
  .mac-gate-cmd { margin-top: 5% !important; padding: 4% 5%; border-radius: 6px; background: #0d1016; }
  .mac-gate-cmd code { color: #e8ecf3; }
  .mac-gate-actions { display: flex; gap: 5%; margin-top: 6%; }
  .mac-gate-actions button { flex: 1; padding: 4% 0; border: 1px solid; border-radius: 6px; cursor: pointer; font: 800 1em var(--sans); background: transparent; transition: background-color .2s ease, transform .15s ease; }
  .mac-gate-actions button:active { transform: scale(.96); }
  .mac-gate-actions [data-gate="allow"] { color: #3ddc97; border-color: #3ddc97; }
  .mac-gate-actions [data-gate="allow"]:hover { background: rgba(61, 220, 151, .16); }
  .mac-gate-actions [data-gate="deny"] { color: #ff6b6b; border-color: #ff6b6b; }
  .mac-gate-actions [data-gate="deny"]:hover { background: rgba(255, 107, 107, .16); }
  .mac-gate-result { display: none; margin-top: 6% !important; font-weight: 800; }
  .mac-gate:not([data-state="ask"]) .mac-gate-actions { display: none; }
  .mac-gate:not([data-state="ask"]) .mac-gate-result { display: block; }
  .mac-gate[data-state="allow"] { border-color: #3ddc97; } .mac-gate[data-state="allow"] .mac-gate-result { color: #3ddc97; }
  .mac-gate[data-state="deny"] { border-color: #ff6b6b; } .mac-gate[data-state="deny"] .mac-gate-result { color: #ff6b6b; }

  .foot-bar { width: 100%; max-width: 900px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    padding: 12px 22px; border-radius: 16px; background: rgba(255, 255, 255, .7); border: 1px solid rgba(255, 255, 255, .9); font-size: .78rem; color: var(--muted); }
  .foot-bar a { color: var(--violet); font-weight: 700; }

  @media (max-width: 900px) {
    .pin:not(.is-photo) .mac-photo { display: none; }
    .pin.is-photo .mac-photo { left: 3%; top: 6%; width: 94%; }
    .pin + .mac-gate { position: static; width: min(100% - 32px, 440px); margin: 0 auto 12px; padding: 16px; font-size: .875rem; transform: none; opacity: 1; visibility: visible; }
    .pin + .mac-gate .mac-gate-actions { gap: 8px; margin-top: 12px; }
    .pin + .mac-gate button { min-height: 44px; padding: 8px; }
  }
</style>
</head>
<body>
  <header class="bar">
    <a class="brand" href="/" aria-label="Về trang chủ Yana">
      <img src="yana-mark.svg" alt="">
      <div><h1>Yana Studio</h1><p>Mở nắp máy, rồi duyệt một lệnh như trong ứng dụng</p></div>
    </a>
    <div class="controls">
      <label class="lidctl" for="lid"><span>Nắp máy</span><input class="range" id="lid" type="range" min="0" max="100" value="0" aria-label="Độ mở nắp máy"></label>
      <button class="btn" id="toggle" type="button">Mở máy</button>
    </div>
  </header>

  <main class="stage" aria-label="MacBook 3D giới thiệu Yana Studio">
    <div class="pin" id="pin">
      <div class="device" role="group" aria-label="MacBook 3D giới thiệu Yana Studio">
        <iframe id="mac3d" data-embed-src="/embed/mac/?screen=home" src="about:blank" title="MacBook 3D giới thiệu Yana Studio" loading="lazy" allowtransparency="true"></iframe>
        <div class="swipe" id="swipe" aria-hidden="true"></div>
        <div class="mac-photo">
          <div class="mac-photo-screen">
            <video class="mac-screen-video" muted playsinline preload="none" poster="assets/mac-screen-home.webp"
              aria-label="Quay màn hình Yana Studio: duyệt lệnh, nhật ký audit, các khả năng"
              data-playlist="/videos/work-screen.mp4 /videos/screen-audit-scrub.mp4 /videos/screen-capabilities-scrub.mp4"></video>
            <div class="mac-gate" id="gate" data-state="ask" role="group" aria-label="Thử duyệt một lệnh như trong Yana Studio">
              <p class="mac-gate-head"><b>⚠</b> Yana muốn dùng <code>run_command</code></p>
              <p class="mac-gate-cmd"><code>rm -rf ./dist ./.cache</code></p>
              <div class="mac-gate-actions"><button type="button" data-gate="allow">Cho phép</button><button type="button" data-gate="deny">Từ chối</button></div>
              <p class="mac-gate-result" aria-live="polite"></p>
            </div>
            <span class="mac-glare" aria-hidden="true"></span>
          </div>
          <img class="mac-photo-bezel" src="assets/apple-macbook-pro-14-silver.webp" alt="" aria-hidden="true" width="1930" height="1270" loading="lazy">
        </div>
      </div>
      <p class="swipe-hint">Vuốt lên hoặc cuộn xuống để mở nắp máy, vuốt xuống để gập lại</p>
    </div>
  </main>

  <footer class="foot-bar">
    <span>Cảnh dựng sẵn để minh hoạ luồng duyệt lệnh của Yana. Không gọi AI, không chạy lệnh trên máy bạn.</span>
    <a href="/">Về trang chủ Yana</a>
  </footer>

<script>
  (() => {
    const pin = document.getElementById('pin');
    const frame = document.getElementById('mac3d');
    const slider = document.getElementById('lid');
    const toggle = document.getElementById('toggle');
    const video = pin.querySelector('.mac-screen-video');
    const gate = document.getElementById('gate');
    const screen = pin.querySelector('.mac-photo-screen');
    const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const PHOTO_AT = 0.98;        // lid value at which the photographed MacBook takes over
    const OPEN_MS = 2400;         // a full close or open
    const FIRST_OPEN_DELAY_MS = 700;
    const GATE_RESET_MS = 3500;   // the approval card asks again this long after an answer
    const GATE_RESULT = { allow: '✓ Đã chạy · đã ghi vào audit', deny: '✕ Đã chặn · đã ghi vào audit' };

    // The screen reel: the recordings play one after another while the photo shows.
    const clips = (video.dataset.playlist || '').split(/\s+/).filter(Boolean);
    let clip = 0;
    const playClip = () => video.play().catch(error => console.warn('[macbook] screen video did not start', error));
    video.addEventListener('ended', () => { clip = (clip + 1) % clips.length; video.src = clips[clip]; playClip(); });
    const reel = on => {
      if (reducedMotion) return;
      if (!on) { video.pause(); return; }
      if (!video.src) video.src = clips[clip];
      playClip();
    };

    let lid = 0, embedReady = false, animation = 0, hasEmbed = false;
    const setLid = value => {
      lid = Math.min(1, Math.max(0, value));
      slider.value = String(Math.round(lid * 100));
      const photo = lid >= PHOTO_AT || !hasEmbed;
      if (photo !== pin.classList.contains('is-photo')) { pin.classList.toggle('is-photo', photo); reel(photo); }
      toggle.textContent = lid >= PHOTO_AT ? 'Gập máy' : 'Mở máy';
      if (embedReady) frame.contentWindow?.postMessage({ type: 'yana:lid', value: lid }, location.origin);
    };
    const animateTo = target => {
      cancelAnimationFrame(animation);
      if (reducedMotion) { setLid(target); return; }
      const from = lid, started = performance.now(), duration = Math.max(300, OPEN_MS * Math.abs(target - from));
      const tick = now => {
        const p = Math.min(1, (now - started) / duration);
        setLid(from + (target - from) * (p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2)); // ease in and out
        if (p < 1) animation = requestAnimationFrame(tick);
      };
      animation = requestAnimationFrame(tick);
    };

    toggle.addEventListener('click', () => animateTo(lid >= PHOTO_AT ? 0 : 1));
    slider.addEventListener('input', () => { cancelAnimationFrame(animation); setLid(Number(slider.value) / 100); });

    // Swipe and scroll: dragging up (or scrolling down) opens the lid, the other way folds it. On release
    // the lid settles fully open or fully closed, the way it settles on the home page.
    const SWIPE_PX = 360;       // vertical drag that covers the whole way from closed to open
    const WHEEL_PX = 900;       // wheel distance that covers the whole way
    const WHEEL_IDLE_MS = 160;  // pause in wheeling after which the lid settles
    const SETTLE_AT = 0.5;      // past this the lid settles open, before it settles closed
    const device = pin.querySelector('.device');
    const settle = () => animateTo(lid >= SETTLE_AT ? 1 : 0);
    let drag = null, wheelTimer = 0;
    device.addEventListener('pointerdown', event => {
      if (!hasEmbed || event.button > 0 || event.target.closest('.mac-gate')) return;
      cancelAnimationFrame(animation);
      drag = { id: event.pointerId, y: event.clientY, lid };
      device.setPointerCapture(event.pointerId);
      device.classList.add('is-dragging');
    });
    device.addEventListener('pointermove', event => {
      if (!drag || event.pointerId !== drag.id) return;
      setLid(drag.lid + (drag.y - event.clientY) / SWIPE_PX);
    });
    const endDrag = event => {
      if (!drag || event.pointerId !== drag.id) return;
      drag = null;
      device.classList.remove('is-dragging');
      settle();
    };
    device.addEventListener('pointerup', endDrag);
    device.addEventListener('pointercancel', endDrag);
    device.addEventListener('wheel', event => {
      if (!hasEmbed) return;
      event.preventDefault();
      cancelAnimationFrame(animation);
      setLid(lid + event.deltaY / WHEEL_PX);
      clearTimeout(wheelTimer);
      wheelTimer = setTimeout(settle, WHEEL_IDLE_MS);
    }, { passive: false });

    // The embed says when it can listen; send the current lid then.
    addEventListener('message', event => {
      if (event.origin !== location.origin || event.source !== frame.contentWindow || event.data?.type !== 'yana:lid-ready') return;
      embedReady = true;
      setLid(lid);
    });
    fetch(frame.dataset.embedSrc, { method: 'HEAD' }).then(res => {
      if (!res.ok || res.headers.get('x-vercel-error')) throw new Error(`embed ${res.status}`);
      hasEmbed = true;
      frame.src = frame.dataset.embedSrc;
      setLid(0);
      setTimeout(() => animateTo(1), FIRST_OPEN_DELAY_MS);
    }).catch(() => {
      // No 3D embed deployed: show the photographed Mac straight away and hide the lid controls.
      hasEmbed = false;
      document.querySelector('.lidctl').hidden = true;
      toggle.hidden = true;
      setLid(1);
    });

    // The approval card on the photographed screen: answer it, then it resets.
    const result = gate.querySelector('.mac-gate-result');
    let resetTimer = 0;
    gate.addEventListener('click', event => {
      const choice = event.target.closest('[data-gate]')?.dataset.gate;
      if (!choice) return;
      gate.dataset.state = choice;
      result.textContent = GATE_RESULT[choice];
      clearTimeout(resetTimer);
      resetTimer = setTimeout(() => { gate.dataset.state = 'ask'; result.textContent = ''; }, GATE_RESET_MS);
    });
    // On narrow screens the card sits under the Mac instead of on its screen.
    const narrow = matchMedia('(max-width: 900px)');
    const placeGate = () => { if (narrow.matches) pin.after(gate); else screen.append(gate); };
    placeGate();
    narrow.addEventListener('change', placeGate);

    // A glare follows the pointer across the glass.
    if (matchMedia('(hover: hover) and (pointer: fine)').matches && !reducedMotion) {
      screen.addEventListener('pointermove', event => {
        const box = screen.getBoundingClientRect();
        screen.style.setProperty('--glare-x', `${event.clientX - box.left}px`);
        screen.style.setProperty('--glare-y', `${event.clientY - box.top}px`);
      }, { passive: true });
    }
  })();
</script>
</body>
</html>
